name: WorkBuddy Daily Checkin

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC，北京时间 = UTC + 8
    # 以下 5 个时点对应北京时间 09:00 / 12:00 / 15:00 / 18:00 / 21:00
    # 多时点触发 + 幂等逻辑：任一时刻成功领取即可，不会重复领分
    - cron: '0 1,4,7,10,13 * * *'
  workflow_dispatch:
    inputs:
      force_notify:
        description: '强制推送一条通知（用于验证 BARK_KEY 配置是否正确）'
        type: boolean
        default: false

# contents: write 供「每月心跳提交」步骤使用，用于防止 GitHub 在仓库长期无提交时停用定时任务
permissions:
  contents: write

# 同一时刻只允许一个实例，避免并发重复请求
concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 使用 Node 24 原生版本，避免 "Node.js 20 is deprecated" 警告
      # （checkout v5 / setup-python v6 是各自第一个 Node 24 版本，行为差异最小）
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run WorkBuddy checkin
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          WB_DOMAIN: www.codebuddy.cn
          # 推送渠道：bark = iPhone 原生通知（把 Bark App 首页那串 key 存进 BARK_KEY）
          #           若要改用微信：NOTIFY_CHANNEL 改成 serverchan，并加一行
          #           SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          #           （Server 酱免费额度仅约 5 条/天，不要配 PUSH_LEVEL: all）
          NOTIFY_CHANNEL: bark
          BARK_KEY: ${{ secrets.BARK_KEY }}
          # 自建 Bark 服务器时填自己的域名；留空用官方 https://api.day.app
          BARK_SERVER: ''
          # 通知分组（便于在通知中心归类）与级别：
          #   active(默认) / timeSensitive(可突破专注模式) / critical(静音也响) / passive(静默进列表)
          BARK_GROUP: workbuddy
          BARK_LEVEL: active
          # 推送级别：action = 只在领取成功 / 出错时推（当前设置，每天 ≤1 条）
          #           all    = 每次巡检都推（含「今日已签到」这类无动作结果，每天 ≤5 条）
          #           off    = 本仓不推送（什么都不推，也不产生告警注解）
          PUSH_LEVEL: action
          # 手动触发时勾选 force_notify=true 可强制推一条，用于验证推送配置。
          # 用 github.event.inputs 而非 inputs：inputs 上下文仅在 workflow_dispatch /
          # workflow_call 可用，定时(schedule)触发时其值为 null 且 inputs 段的 default 不生效，
          # 而定时触发恰恰是本任务的主要运行方式。
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify }}
        run: python checkin.py

      # 每日「运行戳」：每天第一次成功运行时写入并提交一个带时间戳的文件。
      #
      # 为什么要每天（而不是每月）：GitHub 的 schedule 事件是「尽力而为」的，可能延迟、
      # 甚至整次跳过；而本仓库的定时任务原本没有任何远端副作用，导致「今天到底跑没跑」
      # 从外部完全无法判断（2026-09-12 就因此误判过一次：08:15 的 travel 未触发，
      # 猫归来后奖励一直无人领取，却看不出是哪一环的问题）。
      # 现在：**有提交 = 定时在跑；戳的日期变旧 = 定时没触发**，这是不需要任何 API 的硬证据。
      #
      # 两个 workflow 各用独立文件（checkin / travel），否则先跑的会挡住后跑的
      # （travel 08:15 早于 checkin 09:00）。每天每个 workflow 最多提交一次。
      #
      # 注意：schedule / workflow_dispatch 触发时 actions/checkout 处于 detached HEAD，
      # 裸 `git push` 会报 "You are not currently on a branch" 而静默失败
      # （本步骤是 continue-on-error，不会让 job 变红），所以必须显式写 HEAD:main。
      - name: Daily run stamp (proves the scheduled trigger fired)
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: |
          set -e
          mkdir -p .keepalive
          STAMP=".keepalive/last-run-checkin.txt"
          TODAY="$(date +%Y-%m-%d)"
          if [ -f "$STAMP" ] && [ "$(cut -d' ' -f1 "$STAMP")" = "$TODAY" ]; then
            echo "Already stamped today: $TODAY"
            exit 0
          fi
          echo "$(date '+%Y-%m-%d %H:%M:%S %z') checkin event=${GITHUB_EVENT_NAME}" > "$STAMP"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$STAMP"
          git commit -m "chore: daily run stamp ${TODAY} (checkin)"
          git push origin HEAD:main
